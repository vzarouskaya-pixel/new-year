<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Наряди ёлку желаний</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="snow"></canvas>
    
    <button id="musicBtn" class="music-btn" title="Включить/Выключить музыку">🔇</button>
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/11/17/audio_07b9278208.mp3" type="audio/mpeg">
    </audio>

    <main class="container">
        <!-- ЭКРАН 1: Приветствие -->
        <section class="screen active" id="screen-start">
            <h1 class="title">🎄 Наряди ёлку желаний 🎄</h1>
            <p class="subtitle">Ответь на 5 вопросов, наряди пушистую ёлку — и получи своё уникальное новогоднее пожелание!</p>
            <button class="btn" onclick="startQuiz()">Начать ✨</button>
        </section>

        <!-- ЭКРАН 2: Тест -->
        <section class="screen" id="screen-quiz">
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            <h2 class="question" id="questionText"></h2>
            <div class="answers" id="answersBox"></div>
        </section>

        <!-- ЭКРАН 3: Ёлка -->
        <section class="screen" id="screen-tree">
            <h2 class="section-title">Наряди ёлку! 🎁</h2>
            <p class="hint">Перетащи 12 игрушек на ёлку (или кликни по ним)</p>
            
            <div class="tree-area">
                <!-- Новая красивая SVG-ёлка -->
                <div class="tree" id="tree">
                    
                    <!-- Сама ёлка (SVG) -->
                    <svg class="tree-svg" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Градиенты для объема -->
                            <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0d4a1f" />
                                <stop offset="30%" stop-color="#1b7333" />
                                <stop offset="60%" stop-color="#28a745" />
                                <stop offset="100%" stop-color="#15622a" />
                            </linearGradient>
                            <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#4a2c16" />
                                <stop offset="50%" stop-color="#8b5a2b" />
                                <stop offset="100%" stop-color="#4a2c16" />
                            </linearGradient>
                            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
                            </filter>
                        </defs>

                        <!-- Ствол -->
                        <rect x="180" y="520" width="40" height="80" fill="url(#trunkGrad)" rx="4" />
                        
                        <!-- Ярусы елки (создают пушистость) -->
                        <g filter="url(#shadow)" fill="url(#treeGrad)">
                            <!-- Нижний ярус -->
                            <path d="M200,500 C100,500 20,480 20,420 C20,380 80,370 120,380 C100,350 140,330 200,340 C260,330 300,350 280,380 C320,370 380,380 380,420 C380,480 300,500 200,500 Z" />
                            <!-- Средний ярус -->
                            <path d="M200,380 C120,380 50,360 50,300 C50,260 100,250 130,260 C120,230 150,210 200,220 C250,210 280,230 270,260 C300,250 350,260 350,300 C350,360 280,380 200,380 Z" />
                            <!-- Верхний ярус -->
                            <path d="M200,260 C140,260 90,240 90,190 C90,160 120,150 140,160 C135,130 160,110 200,120 C240,110 265,130 260,160 C280,150 310,160 310,190 C310,240 260,260 200,260 Z" />
                            <!-- Макушка -->
                            <path d="M200,140 C160,140 130,120 130,90 C130,70 150,60 165,70 C165,50 180,40 200,40 C220,40 235,50 235,70 C250,60 270,70 270,90 C270,120 240,140 200,140 Z" />
                        </g>
                        
                        <!-- Снег на ветках (для красоты) -->
                        <g fill="#ffffff" opacity="0.6">
                            <path d="M20,420 Q50,400 80,420 Q60,430 20,420 Z" />
                            <path d="M320,420 Q350,400 380,420 Q340,430 320,420 Z" />
                            <path d="M50,300 Q80,280 110,300 Q90,310 50,300 Z" />
                            <path d="M290,300 Q320,280 350,300 Q310,310 290,300 Z" />
                        </g>
                    </svg>

                    <!-- Звезда (поверх SVG) -->
                    <div class="star" id="star">⭐</div>
                </div>
                
                <div class="toys" id="toysBox"></div>
            </div>
            
            <p class="counter">Украшений: <span id="toyCount">0</span> / 12</p>
            <button class="btn hidden" id="finishBtn" onclick="showResult()">Получить пожелание 🎁</button>
        </section>

        <!-- ЭКРАН 4: Результат -->
        <section class="screen" id="screen-result">
            <div class="card" id="resultCard">
                <h2 class="card-title">🎉 С Новым годом! 🎉</h2>
                <div class="card-emoji" id="resultEmoji">🎄</div>
                <h3 id="resultTitle" class="result-title" style="color: #ffd86b; margin-bottom: 10px;"></h3>
                <p class="card-text" id="resultText"></p>
                <p class="card-text" id="resultBonus" style="font-style: italic; color: #a8c4dd; margin-top: 15px;"></p>
                <p class="card-sign">— Твой новогодний эльф 🧝</p>
            </div>
            
            <div class="global-counter">
                🏆 Эту ёлку уже нарядили: <span id="globalCount">...</span> человек
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="restart()">🔄 Заново</button>
                <button class="btn" onclick="shareResult()">📤 Поделиться</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
